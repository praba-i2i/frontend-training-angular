<!DOCTYPE html>
<html>
    <head>
        <h2>Student Registration Form</h2>
    </head>
    <body>
        <!-- <form action="" method="post"> -->
            <table cellpadding="10" cellspacing="5">
                <tbody>
                    <tr>
                        <td><label for="rollno">Roll no. :</label></td>
                        <td><input id="rollno" name="rollno" type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="fname fname">Student name :</label></td>
                        <td>
                            <input id="fname" name="firstName" type="text" placeholder="First Name">
                             - 
                            <input id="lname" name="lastName" type="text" placeholder="Last Name">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="fatherName">Father's name :</label></td>
                        <td><input id="fatherName" name="fatherName" type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="dob">Date of birth :</label></td>
                        <td><input id="dob" name="dob" type="date"></td>
                    </tr>
                    <tr>
                        <td><label for="mobileNo">Mobile no. :</label></td>
                        <td>
                            <input name="countryCode" value="+91" size="2">
                             - 
                            <input id="mobileNo" name="mobileNo" type="number">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="email">Email id :</label></td>
                        <td><input id="email" name="email" type="email"></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password :</label></td>
                        <td><input id="password" name="password" type="password"></td>
                    </tr>
                    <tr>
                        <td><label>Gender :</label></td>
                        <td>
                            <label><input id="mgender" name="gender" type="radio" value="Male">Male</label>
                            <label><input id="fgender" name="gender" type="radio" value="Female">Female</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label>Department :</label></td>
                        <td>
                            <label><input type="checkbox" name="department" value="CSE">CSE</label>
                            <label><input type="checkbox" name="department" value="IT">IT</label>
                            <label><input type="checkbox" name="department" value="ECE">ECE</label>
                            <label><input type="checkbox" name="department" value="EEE">EEE</label>
                            <label><input type="checkbox" name="department" value="Mech">Mech</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="course">Course :</label></td>
                        <td>
                            <select id="course" name="course">
                                <option value="">-----Select Current Course's-----</option>
                                <option value="java">Java</option>
                                <option value="python">Python</option>
                                <option value="angular">Angular</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="city">City :</label></td>
                        <td>
                            <input id="city" name="city" type="text">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="address">Address</label></td>
                        <td><textarea id="address" name="address" value="address" rows="5" cols="20"></textarea></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center"><input type="button" value="Register" onclick="submit()"></td>
                    </tr>
                </tbody>
            </table>
        <!-- </form> -->
        
        <div id="result">

        </div>
    </body>

    <script type="text/javascript">

    function submit() {
        var rollno = document.getElementById("rollno").value;
        var fname = document.getElementById("fname").value;
        var lname = document.getElementById("lname").value;
        var fatherName = document.getElementById("fatherName").value;
        var dob = document.getElementById("dob").value;
        var countryCode = document.getElementsByName("countryCode")[0].value;
        var mobileNo = document.getElementById("mobileNo").value;
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        var gender = document.querySelector(
            'input[name="gender"]:checked'
        );
        var genderValue = gender ? gender.value : "";
        var departments = document.querySelectorAll(
            'input[name="department"]:checked'
        );

        var departmentValue = "";

        departments.forEach(function(department) {
            departmentValue += department.value + " ";
        });
        var course = document.getElementById("course").value;
        var city = document.getElementById("city").value;
        var address = document.getElementById("address").value;


        // Display result
        document.getElementById("result").innerHTML =
            "<p>Roll No: " + rollno + "</p>" +
            "<p>First Name: " + fname + "</p>" +
            "<p>Last Name: " + lname + "</p>" +
            "<p>Father's Name: " + fatherName + "</p>" +
            "<p>Date of Birth: " + dob + "</p>" +
            "<p>Mobile No: " + countryCode + " - " + mobileNo + "</p>" +
            "<p>Email: " + email + "</p>" +
            "<p>Password: " + password + "</p>" +
            "<p>Gender: " + genderValue + "</p>" +
            "<p>Department: " + departmentValue + "</p>" +
            "<p>Course: " + course + "</p>" +
            "<p>City: " + city + "</p>" +
            "<p>Address: " + address + "</p>";
    }

    </script>
</html>
