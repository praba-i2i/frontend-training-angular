<header class="flex items-center justify-between px-8 py-4">
  <h1 class="text-xl font-bold">
    Post Management
  </h1>
  <nav class="flex gap-6">
    <a routerLink="/add-post">
      Add
    </a>

    <a routerLink="/posts">
      List
    </a>
  </nav>
</header>

@if (loading()) {

  <div class="flex items-center justify-center">
    <p>Loading posts...</p>
  </div>

} @else {

  <section class="container mx-auto grid grid-cols-1 gap-6 p-8 md:grid-cols-2 lg:grid-cols-3">

    @for (post of posts; track post.id) {

      <div class="border border-gray-200 p-5">

        <h2 class="text-xl font-bold">
          {{ post.title }}
        </h2>

        <p class="mt-3 text-gray-600">
          {{ post.body }}
        </p>

        <p class="mt-3 text-[14px]">
          Author: {{ post.author }}
        </p>

      </div>
    }
  </section>
}
