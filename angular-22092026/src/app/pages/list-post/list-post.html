@if (loading()) {

  <div class="flex min-h-screen items-center justify-center">
    <p class="text-gray-500">
      Loading posts...
    </p>
  </div>

} @else {

  <div class="container mx-auto p-8">

    <h2 class="mb-8 text-3xl font-bold">
      Manage Posts
    </h2>

    <section
      class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">

      @for (post of posts; track post.id) {

        <article
          class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm">

          <p class="mb-2 text-sm font-medium text-blue-600">
            Author: {{ post.author }}
          </p>

          <h3 class="mb-3 text-xl font-semibold">
            {{ post.title }}
          </h3>

          <p class="mb-5 text-gray-600">
            {{ post.body }}
          </p>

          <div class="flex gap-3">
            <button type="button" (click)="editPost(post.id)" class="rounded bg-green-600 px-4 py-2 text-white">
              Edit
            </button>

            <button type="button" (click)="deletePost(post.id)" class="rounded bg-red-600 px-4 py-2 text-white">
              Delete
            </button>
          </div>
        </article>
      }
    </section>
  </div>
}
