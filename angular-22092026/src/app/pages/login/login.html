<div class="flex min-h-screen items-center justify-center bg-gray-100">
    <div class="w-full max-w-md rounded bg-white p-8">
        <h1 class="mb-2 text-center text-2xl font-bold">Login</h1>
        <form>
            <div>
                <label class="mb-2 block font-medium">Mobile Number:</label>
                <input text="tel" name="mobileNumber" [(ngModel)]="mobileNumber"
                required minlength="10" maxlength="10" pattern="[0-9]{10}"
                placeholder="Enter mobile number" class="w-full rounded border border-gray-300 p-3">
            </div>
            <button type="button" (click)="continue()" [disabled]="mobileNumber.length !== 10"
             class="mb-4 w-full rounded bg-blue-600 mt-4 p-3 text-white disabled:opacity-50">Continue
            </button>

            @if (otpEnabled()) {
                <div class="mb-5">
                    <label class="mb-2 block font-medium">Enter OTP</label>

                    <input type="text" name="otp" [(ngModel)]="otp" maxlength="6"
                        placeholder="Enter OTP" class="w-full rounded border border-gray-300 p-3"/>
                </div>

                <button type="button" (click)="verifyOtp()" [disabled]="otp.length !== 6"
                class="w-full rounded bg-green-600 p-3 text-white disabled:opacity-50">
                Verify OTP
                </button>
            }

            @if (errorMessage()) {
                <p class="mt-4 text-center text-red-500">{{ errorMessage() }}</p>
            }

        </form>
    </div>
</div>
