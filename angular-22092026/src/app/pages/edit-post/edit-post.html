<div class="mx-auto max-w-2xl p-8">

  <h2 class="mb-8 text-3xl font-bold">
    Edit Post
  </h2>

  <form #postForm="ngForm" (ngSubmit)="updatePost()" class="grid gap-5">
    <div>
      <label class="mb-2 block font-medium">
        User
      </label>

      <select name="userId" [(ngModel)]="userId" required class="w-full rounded border border-gray-300 p-3">

        @for (user of users; track user.id) {
          <option [value]="user.id">
            {{ user.username }}
          </option>
        }

      </select>
    </div>

    <div>
      <label class="mb-2 block font-medium"> Title </label>

      <input type="text" name="title" [(ngModel)]="title" required class="w-full rounded border border-gray-300 p-3">
    </div>

    <div>

      <label class="mb-2 block font-medium"> Body </label>
      <textarea name="body" [(ngModel)]="body" required rows="6" class="w-full rounded border border-gray-300 p-3">
      </textarea>

    </div>

    <div class="flex gap-3">
      <button type="submit" [disabled]="postForm.invalid" class="rounded bg-green-600 px-5 py-3 text-white disabled:bg-gray-400">
        Update Post
      </button>

      <button type="button" (click)="cancel()" class="rounded bg-gray-500 px-5 py-3 text-white">
        Cancel
      </button>
    </div>
  </form>
</div>
