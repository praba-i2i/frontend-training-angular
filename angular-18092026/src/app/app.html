<section class="container mx-auto grid grid-cols-1 gap-6 p-5 sm:grid-cols-2 lg:grid-cols-3">
  @for (post of posts; track post.id) {
    <div class="grid grid-rows-[1fr_1fr_20%] rounded-lg border border-gray-200 bg-white p-5">

      <h3 class="text-[24px] font-semibold">{{post.title}}</h3>
      <p>{{post.body}}</p>
      <p class="mt-4 text-gray-500">Author: {{post.author}}</p>
      
    </div> 
  }
</section>
